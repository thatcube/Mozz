# The header is generated, never hand-written.
#
# A hand-written header drifts from the Rust silently: the signature changes,
# the header does not, and the mismatch is not a compile error on either side -
# it is a corrupted argument at run time, in an audio callback, on one platform.
# Generating it makes drift impossible; `--verify` in CI makes a stale committed
# header a build failure rather than a surprise.
language = "C"
header = "// Generated by cbindgen from audio/ffi. Do not edit; run tools/generate-audio-header.sh."
include_guard = "MOZZ_AUDIO_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
prefix = ""

[parse]
parse_deps = false
