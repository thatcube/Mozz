name: Desktop app

# Produces a runnable Mozz desktop build for Windows, macOS and Linux, as a
# downloadable artifact per platform.
#
# All three are real targets, not a Windows build with two afterthoughts. The
# only thing that differs between them is what the operating system already
# provides — see the per-job notes.
#
# WHY THIS IS SEPARATE FROM THE SPIKE
#
# `windows-ffi-spike.yml` answers "does the core work off-Apple". It proves the
# ABI holds and the numbers are good, and it stops there. This workflow answers
# a different question: can someone download a zip and double-click it. That
# needs two things the spike deliberately skipped.
#
#   1. THE SWIFT RUNTIME HAS TO SHIP WITH THE APP.
#
#      Swift is not ABI-stable on Windows or Linux — there is no OS-provided
#      runtime the way there is on macOS and iOS. `MozzFFI.dll` imports
#      swiftCore.dll, Foundation.dll, swift_Concurrency.dll and friends, and on
#      a machine without the Swift toolchain installed none of them exist. The
#      spike sidestepped this by running on a runner that had just installed the
#      toolchain, so PATH resolved them. A user's gaming PC will not.
#
#      So we resolve the import graph and copy what it needs into the app
#      folder, where Windows' loader looks first.
#
#   2. .NET HAS TO SHIP TOO.
#
#      `--self-contained` costs about 70 MB and removes the only other
#      prerequisite. For an app whose entire pitch is "download it and your
#      music works", one runtime install prompt is one too many.

on:
  workflow_dispatch:
  push:
    paths:
      - "clients/desktop/**"
      - "clients/desktop-tests/**"
      - "Sources/**"
      - "Package.swift"
      - ".github/workflows/desktop-app.yml"

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      # Both: the app targets net10.0, the spike harness (reused below as the
      # bundle probe) targets net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Before the long Swift build: this project tests the platform-native
      # credential store against the real OS facility, and the audio engine's
      # pure-managed core (ring buffer, WAV decoder, EQ, and the gapless PCM
      # pipeline). DPAPI cannot be exercised on a developer's Mac at all, so this
      # job is the only place the Windows credential path — and the sample
      # pipeline — are ever run on Windows before a user signs in.
      - name: Test the credential store and audio pipeline
        run: dotnet test clients/desktop-tests/Mozz.Desktop.Tests.csproj -c Release

      # Same amalgamation build as the spike, and for the same reason: GRDB's
      # GRDBSQLite is a systemLibrary target and Windows ships no SQLite. Static,
      # so the header declares plain symbols rather than __declspec(dllimport)
      # and there is nothing extra in the zip.
      - name: Build SQLite with the features GRDB needs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://sqlite.org/2025/sqlite-amalgamation-3510000.zip"
          $root = "$env:RUNNER_TEMP\sqlite"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$root\amalgamation.zip"
          Expand-Archive "$root\amalgamation.zip" -DestinationPath $root -Force
          $src = (Get-ChildItem -Path $root -Directory -Filter "sqlite-amalgamation-*")[0].FullName
          New-Item -ItemType Directory -Force -Path "$root\include","$root\lib" | Out-Null
          Copy-Item "$src\sqlite3.h","$src\sqlite3ext.h" "$root\include" -Force
          Push-Location $src
          clang-cl /c /O2 /MD `
            /DSQLITE_ENABLE_FTS5 /DSQLITE_ENABLE_SNAPSHOT `
            /DSQLITE_ENABLE_PREUPDATE_HOOK /DSQLITE_ENABLE_COLUMN_METADATA `
            /DSQLITE_ENABLE_STAT4 /DSQLITE_ENABLE_RTREE /DSQLITE_ENABLE_JSON1 `
            /DSQLITE_THREADSAFE=1 /DSQLITE_DQS=0 `
            sqlite3.c /Fo:sqlite3.obj
          if ($LASTEXITCODE -ne 0) { Write-Error "sqlite3.c failed to compile"; exit 1 }
          llvm-lib /OUT:"$root\lib\sqlite3.lib" sqlite3.obj
          if ($LASTEXITCODE -ne 0) { Write-Error "failed to archive sqlite3.lib"; exit 1 }
          Pop-Location
          "SQLITE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build MozzFFI.dll
        shell: pwsh
        run: |
          swift build -c release --product MozzFFI `
            -Xcc -I"$env:SQLITE_ROOT\include" `
            -Xlinker "/LIBPATH:$env:SQLITE_ROOT\lib"

      - name: Publish the app
        shell: pwsh
        run: |
          dotnet publish clients/desktop/Mozz.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Resolve MozzFFI.dll's transitive imports and copy the non-system ones in
      # beside it. Walking the actual import table beats a hardcoded list: the
      # set of Swift runtime DLLs changes between toolchain releases, and a
      # missing one produces a bare "DLL not found" at launch with no clue which.
      #
      # llvm-readobj rather than dumpbin: dumpbin only exists inside a Visual
      # Studio developer shell, which this job is not running in. The LLVM tools
      # ship with the Swift toolchain and are already on PATH — the SQLite step
      # above uses clang-cl and llvm-lib from the same place.
      - name: Bundle the Swift runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "publish\win-x64"

          $ffi = Get-ChildItem -Recurse -Filter MozzFFI.dll .build | Select-Object -First 1
          if (-not $ffi) { Write-Error "MozzFFI.dll was not produced"; exit 1 }
          Copy-Item $ffi.FullName $out -Force

          # Everywhere a Swift DLL might live: next to the just-built product,
          # and the toolchain's own runtime directories.
          $searchDirs = @($ffi.DirectoryName)
          $swiftExe = (Get-Command swift -ErrorAction SilentlyContinue).Source
          if ($swiftExe) { $searchDirs += (Split-Path $swiftExe -Parent) }
          foreach ($base in @("$env:LOCALAPPDATA\Programs\Swift", "C:\Program Files\Swift", "C:\Library")) {
            if (Test-Path $base) {
              $searchDirs += (Get-ChildItem -Path $base -Recurse -Directory -Filter bin -ErrorAction SilentlyContinue).FullName
            }
          }
          $searchDirs = $searchDirs | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          Write-Host "searching $($searchDirs.Count) directories for runtime DLLs"

          # System DLLs are provided by Windows; copying them is both pointless
          # and, for the UCRT, actively wrong.
          $systemish = '^(api-ms-|ext-ms-|kernel32|user32|advapi32|ole32|oleaut32|shell32|ws2_32|crypt32|bcrypt|ncrypt|secur32|iphlpapi|dbghelp|shlwapi|userenv|version|winmm|gdi32|comdlg32|msvcrt|vcruntime|ucrtbase|msvcp|concrt|normaliz|dnsapi|winhttp|mswsock|rpcrt4|ntdll|combase|sechost|powrprof|pdh|psapi|setupapi|cfgmgr32|wintrust|imm32|dwmapi|uxtheme|d3d|dxgi|opengl32|winspool|authz|netapi32|mpr)'

          $missing = New-Object System.Collections.Generic.List[string]

          function Resolve-Imports([string]$path, [System.Collections.Generic.HashSet[string]]$seen) {
            $deps = & llvm-readobj --coff-imports $path 2>$null |
              Select-String -Pattern '^\s*Name:\s*(\S+\.dll)\s*$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($dep in $deps) {
              if ($dep -match $systemish) { continue }
              if (-not $seen.Add($dep.ToLower())) { continue }
              $found = $null
              foreach ($dir in $searchDirs) {
                $candidate = Join-Path $dir $dep
                if (Test-Path $candidate) { $found = $candidate; break }
              }
              if ($found) {
                Copy-Item $found $out -Force
                Write-Host "  + $dep"
                Resolve-Imports $found $seen
              } else {
                Write-Host "  ? $dep (NOT FOUND)"
                $missing.Add($dep)
              }
            }
          }

          $seen = [System.Collections.Generic.HashSet[string]]::new()
          Resolve-Imports (Join-Path $out "MozzFFI.dll") $seen
          Write-Host "bundled $($seen.Count - $missing.Count) of $($seen.Count) dependency DLLs"

          # Record exactly which files are Swift's. The verify step needs to copy
          # these and ONLY these next to the harness: the publish directory also
          # holds a complete .NET runtime, and dropping that on top of a
          # differently-versioned self-contained app breaks it in a way that
          # looks like a Swift problem but is not.
          $manifest = @("MozzFFI.dll") + ($seen | Where-Object { $missing -notcontains $_ })
          $manifest | Set-Content -Path "$env:RUNNER_TEMP\swift-runtime-dlls.txt"

          if ($seen.Count -eq 0) {
            # An import walk that finds nothing means the parse failed, not that
            # the DLL is dependency-free. Failing here beats shipping a bundle
            # whose emptiness is discovered by a user.
            Write-Error "no imports were resolved - llvm-readobj output did not parse"
            exit 1
          }
          if ($missing.Count -gt 0) {
            Write-Error "could not locate: $($missing -join ', ')"
            exit 1
          }

      # FFmpeg does the decoding (see clients/desktop/Audio/README.md). macOS and
      # Linux users have a package manager and generally already have it; Windows
      # has neither, and the entire pitch of this build is "download it and your
      # music works". A missing-prerequisite dialog would break that on the one
      # platform the project exists for, so the Windows zip carries its own.
      #
      # The "essentials" build: it carries every decoder Mozz needs (FLAC, ALAC,
      # AAC, Vorbis, Opus, MP3, WAV are all native FFmpeg decoders) without the
      # full build's extra encoders, which we never invoke — 106 MB against 240.
      #
      # These are GPL-licensed builds, which is fine and in fact the simplest
      # case: Mozz is GPL-3.0 itself, and FFmpeg is invoked as a separate
      # executable rather than linked, the loosest coupling available. The
      # licence text ships beside the binary.
      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip"
          $tmp = "$env:RUNNER_TEMP\ffmpeg"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$tmp\ffmpeg.zip"
          Expand-Archive "$tmp\ffmpeg.zip" -DestinationPath $tmp -Force

          $exe = Get-ChildItem -Path $tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "ffmpeg.exe not found in the downloaded archive"; exit 1 }
          Copy-Item $exe.FullName "publish\win-x64\ffmpeg.exe" -Force

          # Ship the licence text with the binary, as the LGPL requires.
          $license = Get-ChildItem -Path $tmp -Recurse -Include "LICENSE*","COPYING*" |
                     Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "publish\win-x64\FFMPEG-LICENSE.txt" -Force }

          # It has to actually run: a build for the wrong architecture, or one
          # missing a DLL, fails here rather than the first time someone presses
          # play. Decoding a generated tone end to end also proves the codecs are
          # present, which `-version` alone would not.
          $ffmpeg = (Resolve-Path "publish\win-x64\ffmpeg.exe").Path
          & $ffmpeg -hide_banner -loglevel error `
            -f lavfi -i "sine=frequency=440:duration=1" `
            -f flac "$tmp\probe.flac"
          if ($LASTEXITCODE -ne 0) { Write-Error "bundled ffmpeg could not encode"; exit 1 }
          & $ffmpeg -hide_banner -loglevel error -i "$tmp\probe.flac" -f f32le -ac 2 -ar 48000 NUL
          if ($LASTEXITCODE -ne 0) { Write-Error "bundled ffmpeg could not decode FLAC to f32le"; exit 1 }
          $size = [math]::Round((Get-Item $ffmpeg).Length / 1MB, 1)
          Write-Host "bundled ffmpeg.exe ($size MB); FLAC -> f32le round trip ok"

      # The real test: does it load on a machine that is NOT the build machine?
      # We approximate one by scrubbing every Swift directory out of PATH, so
      # the loader can only find what we copied. A missing runtime DLL then
      # fails here rather than on a user's PC.
      #
      # The spike harness is the probe, rather than a bespoke LoadLibrary check:
      # it already opens a database, runs FTS5 search and verifies the
      # continuity hashes, so a bundle that satisfies it is known to support the
      # actual work — not merely to load.
      - name: Verify the bundle runs with Swift off PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Self-contained: scrubbing PATH to prove the SWIFT runtime is bundled
          # must not also break .NET's own runtime resolution, or the step fails
          # for a reason that has nothing to do with what it is testing.
          dotnet publish spike/windows-ffi/Harness/Harness.csproj -c Release `
            -r win-x64 --self-contained true -o harness-out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Only the Swift DLLs — see the manifest note in the bundling step.
          Get-Content "$env:RUNNER_TEMP\swift-runtime-dlls.txt" | ForEach-Object {
            $dll = Join-Path "publish\win-x64" $_
            if (Test-Path $dll) { Copy-Item $dll harness-out -Force }
            else { Write-Error "manifest lists $_ but it is not in the bundle"; exit 1 }
          }

          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)swift') -and ($_ -notmatch '(?i)\\Library\\')
          }) -join ';'
          Write-Host "PATH scrubbed of Swift directories; running harness"

          & .\harness-out\MozzSpikeHarness.exe 5000
          if ($LASTEXITCODE -ne 0) {
            Write-Error "the harness failed with Swift off PATH - the runtime bundle is incomplete"
            exit 1
          }
          Write-Host "bundle is self-contained"

      - name: Package
        shell: pwsh
        run: |
          $version = "0.1.0-$($env:GITHUB_SHA.Substring(0,7))"
          Compress-Archive -Path publish\win-x64\* -DestinationPath "Mozz-win-x64-$version.zip" -Force
          $size = [math]::Round((Get-Item "Mozz-win-x64-$version.zip").Length / 1MB, 1)
          Write-Host "Mozz-win-x64-$version.zip ($size MB)"
          "PACKAGE=Mozz-win-x64-$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: mozz-desktop-windows-x64
          path: ${{ env.PACKAGE }}
          retention-days: 30

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test the credential store and audio pipeline
        run: dotnet test clients/desktop-tests/Mozz.Desktop.Tests.csproj -c Release

      - name: Build MozzFFI.dylib
        run: swift build -c release --product MozzFFI

      - name: Publish the app
        run: |
          dotnet publish clients/desktop/Mozz.Desktop.csproj \
            -c Release -r osx-arm64 --self-contained true \
            -o publish/osx-arm64
          cp .build/release/libMozzFFI.dylib publish/osx-arm64/

      # macOS ships the Swift runtime, so there is nothing to bundle — but the
      # dylib still has to be found, and `@rpath` problems show up as the same
      # "image not found" a missing Windows DLL gives.
      - name: Verify the dylib loads and exports the session ABI
        run: |
          set -euo pipefail
          otool -L publish/osx-arm64/libMozzFFI.dylib
          for symbol in mozz_session_open mozz_session_call mozz_session_close mozz_ffi_free_string; do
            if ! nm -gU publish/osx-arm64/libMozzFFI.dylib | grep -q "_${symbol}$"; then
              echo "exported symbol missing: ${symbol}" >&2
              exit 1
            fi
          done
          echo "libMozzFFI.dylib exports the session ABI"

      - name: Package
        run: |
          version="0.1.0-${GITHUB_SHA:0:7}"
          ditto -c -k --sequesterRsrc --keepParent publish/osx-arm64 "Mozz-osx-arm64-${version}.zip"
          echo "PACKAGE=Mozz-osx-arm64-${version}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: mozz-desktop-macos-arm64
          path: ${{ env.PACKAGE }}
          retention-days: 30

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.2"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Avalonia needs an X/GL stack present to link and to run headless checks;
      # ALSA is what miniaudio opens on Linux.
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-6 libice6 libsm6 libfontconfig1 \
            libicu-dev ffmpeg

      - name: Test the credential store and audio pipeline
        run: dotnet test clients/desktop-tests/Mozz.Desktop.Tests.csproj -c Release

      # Ubuntu does ship libsqlite3, unlike Windows — but shipping it is not the
      # same as shipping it with FTS5, and Mozz's search is FTS5. Building the
      # amalgamation makes the feature set an explicit list rather than a
      # property of whichever distro the user happens to run, which matters more
      # on Linux than anywhere else.
      - name: Build SQLite with the features GRDB needs
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sqlite"
          mkdir -p "$root/include" "$root/lib"
          curl -fsSL -o "$root/amalgamation.zip" https://sqlite.org/2025/sqlite-amalgamation-3510000.zip
          unzip -q "$root/amalgamation.zip" -d "$root"
          src=$(find "$root" -maxdepth 1 -type d -name 'sqlite-amalgamation-*' | head -1)
          cp "$src/sqlite3.h" "$src/sqlite3ext.h" "$root/include/"
          cc -c -O2 -fPIC \
            -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_SNAPSHOT \
            -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_COLUMN_METADATA \
            -DSQLITE_ENABLE_STAT4 -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_JSON1 \
            -DSQLITE_THREADSAFE=1 -DSQLITE_DQS=0 \
            "$src/sqlite3.c" -o "$root/sqlite3.o"
          ar rcs "$root/lib/libsqlite3.a" "$root/sqlite3.o"
          echo "SQLITE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build libMozzFFI.so
        run: |
          swift build -c release --product MozzFFI \
            -Xcc -I"$SQLITE_ROOT/include" \
            -Xlinker -L"$SQLITE_ROOT/lib"

      - name: Publish the app
        run: |
          dotnet publish clients/desktop/Mozz.Desktop.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o publish/linux-x64
          cp .build/release/libMozzFFI.so publish/linux-x64/

      # Swift is no more ABI-stable on Linux than on Windows, and a desktop user
      # will not have a Swift toolchain. Same approach as the Windows job:
      # resolve the real import graph rather than guessing at a list of names.
      - name: Bundle the Swift runtime
        run: |
          set -euo pipefail
          out=publish/linux-x64
          manifest="$RUNNER_TEMP/swift-runtime-libs.txt"
          : > "$manifest"

          resolve() {
            ldd "$1" 2>/dev/null | awk '/=>/ {print $1, $3}' | while read -r name path; do
              case "$name" in
                libswift*|libFoundation*|lib_Foundation*|libdispatch*|libBlocksRuntime*)
                  if [ -f "$path" ] && [ ! -f "$out/$name" ]; then
                    cp "$path" "$out/"
                    echo "$name" >> "$manifest"
                    echo "  + $name"
                    resolve "$path"
                  fi
                  ;;
              esac
            done
          }
          resolve "$out/libMozzFFI.so"

          # Record exactly which files are Swift's. The verify step must copy
          # these and ONLY these beside the harness: this directory also holds a
          # complete self-contained .NET runtime, and a `lib*.so` glob drops .NET
          # 10's libcoreclr.so on top of the harness's .NET 8 one, which fails as
          # "Could not load type 'System.Runtime.EH'" — a message that points
          # nowhere near the cause.
          echo "libMozzFFI.so" >> "$manifest"
          count=$(wc -l < "$manifest")
          if [ "$count" -le 1 ]; then
            echo "no Swift runtime libraries were bundled - ldd output did not parse" >&2
            exit 1
          fi
          echo "bundled $((count - 1)) Swift runtime libraries"

      # The same standalone check the Windows job runs: strip the toolchain out
      # of the loader's view, then drive the C ABI for real. A bundle that is
      # incomplete fails here rather than on someone's desktop.
      - name: Verify the bundle runs without the toolchain
        run: |
          set -euo pipefail
          dotnet publish spike/windows-ffi/Harness/Harness.csproj -c Release \
            -r linux-x64 --self-contained true -o harness-out
          # Only the Swift libraries — see the manifest note in the bundling step.
          while read -r lib; do
            cp "publish/linux-x64/$lib" harness-out/
          done < "$RUNNER_TEMP/swift-runtime-libs.txt"
          # LD_LIBRARY_PATH is REPLACED with just the harness directory, not
          # appended to: the toolchain install puts its own runtime on that
          # variable, and leaving it there would let the harness succeed on
          # libraries a user will not have. ($ORIGIN is not expanded in
          # LD_LIBRARY_PATH — only in an RPATH — so the path is spelled out.)
          LD_LIBRARY_PATH="$PWD/harness-out" ./harness-out/MozzSpikeHarness 5000

      - name: Package
        run: |
          version="0.1.0-${GITHUB_SHA:0:7}"
          tar -C publish/linux-x64 -czf "Mozz-linux-x64-${version}.tar.gz" .
          echo "PACKAGE=Mozz-linux-x64-${version}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: mozz-desktop-linux-x64
          path: ${{ env.PACKAGE }}
          retention-days: 30
