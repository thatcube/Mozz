name: Mozz
options:
  bundleIdPrefix: com.thatcube
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    MARKETING_VERSION: "2026.7.8"
    CURRENT_PROJECT_VERSION: "1"
    # Language mode 5 (toolchain is newer). Candidate B favours pragmatic,
    # high-performance code with opt-in Sendable/actors rather than repo-wide
    # Swift 6 strict concurrency (that is Candidate C's thesis).
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Simulator builds need no signing; device builds set DEVELOPMENT_TEAM locally.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  MozzKit:
    path: .

targets:
  Mozz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Mozz
    dependencies:
      - package: MozzKit
        product: MozzApp
      - target: MozzWidget
    entitlements:
      path: App/Mozz/Mozz.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thatcube.Mozz
        # Granted by Apple as a managed capability, so it rides the normal
        # provisioning profile like any other. Adding it needs the profile
        # re-minted once through the Xcode GUI — headless xcodebuild cannot
        # create a profile for a newly-added capability.
        com.apple.developer.carplay-audio: true
        # SiriKit. Required for the media intents the app handles in-process
        # (App/…/MozzAppDelegate). Like CarPlay above, adding it needs the
        # provisioning profile re-minted once through the Xcode GUI.
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Mozz
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad (tvOS is a later, thin-UI target)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Mozz/Info.plist
      properties:
        CFBundleDisplayName: Mozz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: SplashBackground
          UIImageName: MozzLogo
          UIImageRespectsSafeAreaInsets: true
        # CarPlay requires multi-scene support and its own scene role. Only the
        # CarPlay role is declared: the SwiftUI `WindowGroup` continues to
        # provide the phone window implicitly, and declaring the window role
        # here as well would take that over and break it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            # The phone window must be declared too. Once UISceneConfigurations
            # exists, iOS stops synthesising a configuration for any role that
            # isn't listed — so a CarPlay-only manifest left the app with no
            # window scene and it was refused launch outright. No delegate class:
            # that's SwiftUI's job, and naming one here takes the window over.
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: Mozz CarPlay
                # The ObjC name registered by @objc(MozzCarPlaySceneDelegate), so
                # the plist needn't know which module the class lives in.
                UISceneDelegateClassName: MozzCarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires ALL four orientations (an app that omits any
        # must opt out of multitasking with UIRequiresFullScreen). Upside-down is
        # only sensible on iPad, hence the ~ipad override rather than widening
        # the iPhone list.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CRITICAL for a music app: keep audio playing in the background.
        UIBackgroundModes:
          - audio
        # Plex/Jellyfin servers are frequently self-hosted on the LAN over plain
        # HTTP; allow arbitrary + local-network loads. (A production build could
        # tighten this to per-host exceptions once a server is chosen.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # iOS 14+ requires a purpose string before touching the local network
        # (LAN server discovery / direct-play from a home server).
        NSLocalNetworkUsageDescription: "Mozz connects to Plex and Jellyfin media servers on your local network."
        NSBonjourServices:
          - _jellyfin._tcp
        # Custom URL scheme for deep links (mozz://album/<id>, mozz://tab/library,
        # …). Widget tiles and shared links open the app straight to a screen.
        CFBundleURLTypes:
          - CFBundleURLName: com.thatcube.Mozz
            CFBundleURLSchemes:
              - mozz
        # Handoff: activity types this app advertises/continues across devices.
        # Must be pre-declared or the OS won't route onContinueUserActivity.
        NSUserActivityTypes:
          - com.thatcube.mozz.album
          - com.thatcube.mozz.artist
          - com.thatcube.mozz.playlist
          - com.thatcube.mozz.genre
          - com.thatcube.mozz.library
        # Siri. `INIntentsSupported` is what makes these intents eligible for
        # *in-app* handling — no extension — which is what lets Siri start
        # playback in the background with the phone locked.
        #
        # A HomePod has no apps of its own: it parses the request and forwards the
        # intent to the iPhone, where Mozz plays and the audio is AirPlayed back to
        # the speaker. So this is the whole HomePod story, and it costs nothing
        # extra beyond what CarPlay and the Siri button already use.
        INIntentsSupported:
          - INPlayMediaIntent
          - INAddMediaIntent
          - INUpdateMediaAffinityIntent
        # Without at least one category Siri will not offer the app for media
        # requests at all. Music only — Mozz is not a podcast or audiobook player,
        # and claiming otherwise would have Siri route requests it can't answer.
        INSupportedMediaCategories:
          - INMediaCategoryMusic
        NSSiriUsageDescription: "Siri needs access to your library so you can ask for music by name — including from a HomePod, which hands the request to your iPhone and plays through the speaker."

  MozzWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/MozzWidget
    dependencies:
      - package: MozzKit
        product: MozzCore
    entitlements:
      path: App/MozzWidget/MozzWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.thatcube.Mozz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Mozz.widget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/MozzWidget/Info.plist
      properties:
        CFBundleDisplayName: Mozz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
