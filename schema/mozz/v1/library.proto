// The library-reading half of the Mozz command surface.
//
// This file is the source of truth for these commands. The Swift dispatch side,
// the idiomatic Swift client, and the C#/Kotlin/TypeScript clients are all
// generated from it — a command that is not declared here cannot be called from
// anywhere, which is the point. See ADR-0016.
//
// Generated output is committed, not produced at build time. Run
// `tools/generate-schema.sh` after editing; CI regenerates and fails if the
// checked-in output has drifted.

syntax = "proto3";

package mozz.v1;

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// An opaque resume position for a paged listing. Clients must not parse it;
// they hand back whatever the previous page returned.
message PageCursor {
  string token = 1;
}

message Page {
  // Absent when this is the last page.
  optional PageCursor next = 1;
}

message AlbumSummary {
  string remote_id = 1;
  string title = 2;
  string artist_name = 3;
  // A missing year is not the same as year 0: the desktop's "newest release"
  // tie-breaker treats unknown dates as less certain than dated releases.
  optional int32 year = 4;
  optional string artwork_key = 5;
  int32 track_count = 6;
  int64 id = 7;
  string server_id = 8;
  optional string artist_remote_id = 9;
  string group_key = 10;
  optional string sort_title = 11;
  repeated string genres = 12;
  bool is_favorite = 13;
  // Unix seconds from the server, when known. Presence is significant because
  // "unknown" sorts below a real timestamp, including the epoch.
  optional double added_at = 14;
  // The legacy desktop computes this via a separate command when absent; carrying
  // the core's answer here keeps the typed album path from needing that detour.
  optional string release_kind = 15;
  // Presence is significant while clients migrate: absent means "fall back to
  // the old classifier", while false means the core explicitly classified it.
  optional bool is_single_or_ep = 16;
}

message Artist {
  string remote_id = 1;
  string name = 2;
  optional string artwork_key = 3;
  int32 album_count = 4;
  int64 id = 5;
  string server_id = 6;
  optional string sort_name = 7;
  optional string hero_artwork_key = 8;
  repeated string genres = 9;
  bool is_favorite = 10;
}

// Track listings carry the metadata a shell needs to render and start playback
// without a second lookup. That mirrors the existing facade's list payload,
// where rating/favourite/loudness data travel with the row because hiding them
// behind per-track detail calls would make scrolling and queueing chatty.
message TrackSummary {
  string remote_id = 1;
  string title = 2;
  string artist_name = 3;
  optional string album_title = 4;
  optional string album_remote_id = 5;
  optional int32 track_number = 6;
  optional int32 disc_number = 7;
  double duration_seconds = 8;
  optional string artwork_key = 9;
  bool is_favorite = 10;
  optional double rating = 11;
  optional double added_at = 12;
  optional double normalization_gain_db = 13;
  int64 id = 14;
  string server_id = 15;
}

message Library {
  string id = 1;
  string name = 2;
  string server_id = 3;
}

// ---------------------------------------------------------------------------
// Commands
//
// Each command declares exactly the arguments it needs. Contrast the current
// hand-written facade, where every command shares one SessionRequest struct of
// 38 optional fields and checks the ones it wants at runtime — so `artist`
// carries `guard let remoteId = request.remoteId, let serverId else { fail }`,
// and a command that forgets to check simply misbehaves.
// ---------------------------------------------------------------------------

// Takes no arguments. The empty message is deliberate: it gives the command a
// place to grow an argument later without changing its shape at every call site.
message LibrariesRequest {}

message LibrariesResponse {
  repeated Library libraries = 1;
}

message AlbumsRequest {
  string server_id = 1;
  // Absent means "from the beginning".
  optional PageCursor after = 2;
  int32 limit = 3;
}

message AlbumsResponse {
  repeated AlbumSummary albums = 1;
  Page page = 2;
}

// Uses the same cursor shape as albums so all large library shelves have one
// paging contract. The old facade accepts offset too, but the cursor is the
// behaviour kept here because it is stable while sync is mutating the database.
message ArtistsRequest {
  string server_id = 1;
  // Absent means "from the beginning".
  optional PageCursor after = 2;
  int32 limit = 3;
}

message ArtistsResponse {
  repeated Artist artists = 1;
  Page page = 2;
}

// Tracks are the largest listing in most libraries, so they get the same
// keyset cursor as albums/artists rather than preserving the old offset field.
message TracksRequest {
  string server_id = 1;
  // Absent means "from the beginning".
  optional PageCursor after = 2;
  int32 limit = 3;
}

message TracksResponse {
  repeated TrackSummary tracks = 1;
  Page page = 2;
}

// Both fields are required. Today this is a runtime guard in the facade; here
// it is the shape of the message, and every generated client enforces it.
message ArtistRequest {
  string server_id = 1;
  string remote_id = 2;
}

message ArtistResponse {
  Artist artist = 1;
}

// Detail shelves are intentionally unpaged: the existing core answers them as a
// bounded album list for one artist, ordered by the repository's album-detail
// query, and the schema records that shape instead of inventing a cursor.
message ArtistAlbumsRequest {
  string server_id = 1;
  string remote_id = 2;
}

message ArtistAlbumsResponse {
  repeated AlbumSummary albums = 1;
}

// A caller may know the consolidated album group key from a list row or only a
// representative album remote id from an older path. Keeping both preserves the
// existing facade behaviour: prefer the group when present, otherwise resolve
// the group containing the remote id.
message AlbumTracksRequest {
  string server_id = 1;
  optional string remote_id = 2;
  optional string group_key = 3;
}

message AlbumTracksResponse {
  repeated TrackSummary tracks = 1;
}

// Counts are a cheap server-scoped summary used for headers/progress without
// materialising any list. The three numbers travel together because callers
// present them together and the repository already computes them as the public
// library totals.
message CountsRequest {
  string server_id = 1;
}

message CountsResponse {
  int32 artists = 1;
  int32 albums = 2;
  int32 tracks = 3;
}

// ---------------------------------------------------------------------------
// Subscriptions
//
// The reason these are first-class rather than bolted on: SwiftUI views observe
// GRDB's ValueObservation directly today, so the database changes and the view
// redraws. A request/response-only surface cannot express that, and iOS would
// silently lose live updates when it moves onto the generated client. The
// desktop has the same need in the other direction — it currently has no way to
// be told "the sync finished" without polling.
// ---------------------------------------------------------------------------

message SubscriptionToken {
  uint64 id = 1;
}

message CancelRequest {
  SubscriptionToken token = 1;
}

message CancelResponse {}

// Fires whenever the locally-stored library changes for this server —
// a sync landing, a favourite toggling, a download completing.
message WatchLibraryRequest {
  string server_id = 1;
}

message LibraryChanged {
  // Which kinds of rows changed, so a client can refresh narrowly rather than
  // reloading everything.
  repeated string changed_entities = 1;
}

// ---------------------------------------------------------------------------
// Dispatch
//
// One envelope in, one envelope out. The oneof is what closes the loop: adding
// a command means adding a variant here, and the generated Swift dispatcher
// will not compile until the core implements it.
// ---------------------------------------------------------------------------

message Request {
  // Echoed back on the matching Response so a client can pair them.
  uint64 id = 1;

  oneof command {
    LibrariesRequest libraries = 10;
    AlbumsRequest albums = 11;
    ArtistRequest artist = 12;
    WatchLibraryRequest watch_library = 13;
    CancelRequest cancel = 14;
    ArtistsRequest artists = 15;
    TracksRequest tracks = 16;
    AlbumTracksRequest album_tracks = 17;
    ArtistAlbumsRequest artist_albums = 18;
    CountsRequest counts = 19;
  }
}

message Failure {
  string message = 1;
}

message Response {
  uint64 id = 1;

  oneof result {
    Failure failure = 2;
    LibrariesResponse libraries = 10;
    AlbumsResponse albums = 11;
    ArtistResponse artist = 12;
    SubscriptionToken watch_library = 13;
    CancelResponse cancel = 14;
    ArtistsResponse artists = 15;
    TracksResponse tracks = 16;
    AlbumTracksResponse album_tracks = 17;
    ArtistAlbumsResponse artist_albums = 18;
    CountsResponse counts = 19;
  }
}

// Pushed from the core to the shell, unprompted, for an active subscription.
message Event {
  SubscriptionToken token = 1;

  oneof payload {
    LibraryChanged library_changed = 10;
  }
}
